<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive UWW 2026 referee practice examination for Category III, II, I and IS, available in English, Spanish, French and Russian.">
<title>UWW Referee Practice Examination 2026</title>
<style>
:root{--ink:#12202b;--muted:#61717f;--paper:#f4f1ea;--surface:#fffefa;--line:#d9d4c8;--navy:#0b3558;--blue:#075d91;--red:#c83232;--gold:#d6a928;--ok:#18734c;--bad:#aa2d2d;--shadow:0 12px 34px rgba(18,32,43,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;line-height:1.55}.app{min-height:100vh}.mast{background:var(--navy);color:white;border-bottom:5px solid var(--gold)}.mast-inner{max-width:1240px;margin:auto;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;gap:16px;align-items:center}.official-logo{display:block;width:190px;max-width:31vw;height:auto;filter:brightness(0) invert(1)}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;color:#bed5e7;font-weight:700}.mast h1{font:700 clamp(1.25rem,2.2vw,2rem) Georgia,serif;margin:3px 0}.header-tools{display:flex;align-items:center;gap:12px}.status{font-size:.82rem;padding:8px 12px;border:1px solid #60809a;border-radius:4px;color:#e5eef5}.language{display:flex;align-items:center;gap:8px}.language label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:#bed5e7;font-weight:700}.language select{background:#fff;color:var(--navy);border:0;border-radius:3px;padding:10px 34px 10px 11px;font:600 .9rem "Segoe UI",Arial,sans-serif;cursor:pointer}.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding:30px 28px 64px}.sidebar{position:sticky;top:18px;align-self:start}.panel{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px}.progress-track{height:8px;background:#e6e1d8;margin:12px 0;border-radius:9px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--gold);transition:width .25s}.progress-number{font:700 2rem Georgia,serif}.nav{display:grid;gap:7px;margin-top:18px}.nav button,.action{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px 12px;text-align:left;font-weight:650;cursor:pointer;border-radius:3px;min-height:44px}.nav button:hover,.nav button.active{border-color:var(--blue);color:var(--blue);background:#edf5fa}.nav small{display:block;font-weight:400;color:var(--muted)}.action.primary{background:var(--navy);color:white;border-color:var(--navy);text-align:center}.action.secondary{text-align:center;margin-top:8px;width:100%}.hero{padding:0 0 22px;border-bottom:1px solid var(--line);margin-bottom:24px}.hero h2{font:700 clamp(2rem,5vw,4.5rem)/.98 Georgia,serif;letter-spacing:-.035em;margin:0 0 16px;max-width:850px}.hero p{max-width:820px;color:var(--muted);font-size:1.05rem}.alert{border-top:3px solid var(--gold);background:#fff8df;padding:14px 16px;margin:20px 0;font-size:.92rem}.category{display:none}.category.active{display:block}.category-head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);margin:8px 0 18px;padding-bottom:10px}.category-head h3{font:700 1.85rem Georgia,serif;margin:0}.question{background:var(--surface);border:1px solid var(--line);margin:0 0 14px;padding:20px 22px;box-shadow:0 4px 16px rgba(18,32,43,.04)}.qtop{display:flex;gap:14px;align-items:flex-start}.qnum{min-width:34px;height:34px;display:grid;place-items:center;background:var(--navy);color:white;font-weight:800}.qtext{font-weight:650;font-size:1.02rem}.options{display:grid;gap:8px;margin:16px 0 0 48px}.option{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);cursor:pointer;background:white}.option:hover{border-color:#8ca9bd}.option input{margin-top:4px;accent-color:var(--navy)}textarea{width:calc(100% - 48px);margin:16px 0 0 48px;min-height:96px;border:1px solid var(--line);padding:12px;font:inherit;resize:vertical;background:white}textarea:focus,.option:focus-within{outline:3px solid rgba(7,93,145,.17);border-color:var(--blue)}.answer{display:none;margin:16px 0 0 48px;border-top:1px solid var(--line);padding-top:14px;color:#253844}.question.reviewed .answer{display:block}.answer strong{color:var(--navy)}.selfcheck{display:flex;gap:8px;margin-top:12px}.selfcheck button{border:1px solid var(--line);background:white;padding:8px 12px;cursor:pointer}.selfcheck button.selected{background:var(--navy);color:white}.question.correct{border-color:#72aa8d}.question.incorrect{border-color:#cf8989}.results{display:none;background:var(--navy);color:white;padding:22px;margin:24px 0}.results.show{display:block}.results strong{font:700 2rem Georgia,serif}.sources{margin-top:42px;border-top:2px solid var(--ink);padding-top:20px}.sources a{color:var(--blue);word-break:break-word}.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--surface);margin:20px 0}.meta-grid div{padding:14px;border-right:1px solid var(--line)}.meta-grid div:last-child{border:0}.meta-grid strong{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
@media(max-width:820px){.mast-inner{padding:18px}.mast-inner{align-items:flex-start}.header-tools{align-items:flex-end;flex-direction:column}.status{display:none}.official-logo{width:145px;max-width:42vw}.layout{display:block;padding:22px 16px}.sidebar{position:static;margin-bottom:22px}.nav{grid-template-columns:1fr 1fr}.hero h2{font-size:2.55rem}.meta-grid{grid-template-columns:1fr}.meta-grid div{border-right:0;border-bottom:1px solid var(--line)}.options,textarea,.answer{margin-left:0;width:100%}.qtop{gap:10px}.question{padding:16px}}
@media print{.sidebar,.action,.selfcheck{display:none!important}.layout{display:block;padding:0}.category{display:block!important}.question{break-inside:avoid;box-shadow:none}.answer{display:block}.mast{background:white;color:black;border-bottom:2px solid black}.eyebrow{color:#444}.official-logo{filter:none}.status{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><div class="app">
<header class="mast"><div class="mast-inner"><div class="brand"><img class="official-logo" src="assets/uww-logo.png" alt="United World Wrestling"><div><div class="eyebrow" id="mastEyebrow"></div><h1 id="mastTitle"></h1></div></div><div class="header-tools"><div class="language"><label for="languageSelect" id="languageLabel">Language</label><select id="languageSelect" aria-label="Select language"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="ru">Русский</option></select></div><div class="status" id="statusText"></div></div></div></header>
<div class="layout"><aside class="sidebar"><div class="panel"><div class="eyebrow" style="color:var(--muted)" id="progressLabel"></div><div class="progress-number"><span id="done">0</span>/48</div><div class="progress-track"><div class="progress-bar" id="bar"></div></div><div id="percent"></div><nav class="nav" id="nav"></nav><button class="action secondary" id="reset"></button></div></aside>
<main><section class="hero"><div class="eyebrow" style="color:var(--blue)">Greco-Roman · Freestyle · Women’s Wrestling</div><h2 id="heroTitle"></h2><p id="heroText"></p><div class="meta-grid"><div><strong id="rulebookLabel"></strong><span id="rulebookValue"></span></div><div><strong id="updateLabel"></strong><span id="updateValue"></span></div><div><strong id="formatLabel"></strong><span id="formatValue"></span></div></div><div class="alert" id="notice"></div></section>
<div id="loading" class="panel" role="status">Loading examination…</div><div id="quiz"></div><section class="sources"><h2 id="sourcesTitle"></h2><ol id="sources"></ol></section></main></div></div>
<script>
const UI={
 en:{language:'Language',mastEyebrow:'Refereeing education · 2026',mastTitle:'Practice Examination',status:'V1 · Educational material · Official sources cited',progress:'Your progress',answered:'answered',reset:'Reset answers',heroTitle:'Decide like the call matters.',heroText:'A progressive evaluation form for Category III, II, I and IS. It combines fundamentals, scoring, procedures, challenge, passivity and complex refereeing leadership cases.',rulebook:'Rulebook',rulebookValue:'January 2026',update:'Effective update',updateValue:'1 January 2026',format:'Format',formatValue:'48 questions · 4 levels',notice:'<b>Notice:</b> This is educational practice material, not an official UWW certification examination. The English rule text prevails in case of discrepancy. The UWW logo identifies the source organization and does not imply endorsement.',level:'Evaluation level',evaluate:'Evaluate this category',write:'Write your decision and procedure…',model:'Model answer',got:'I got it',review:'Review needed',automatic:'automatic items correct',open:'open answers self-confirmed. Review the model answers below.',clear:'Clear all saved answers?',sources:'Official sources',loading:'Loading examination…',loadError:'The examination could not be loaded. Please refresh the page.',labels:{'Category III':'Rule fundamentals','Category II':'Practical application','Category I':'Advanced procedures','Category IS':'Leadership and interpretation'}},
 es:{language:'Idioma',mastEyebrow:'Educación arbitral · 2026',mastTitle:'Examen de práctica',status:'V1 · Material educativo · Fuentes oficiales citadas',progress:'Tu progreso',answered:'respondidas',reset:'Borrar respuestas',heroTitle:'Decide como si la acción importara.',heroText:'Formulario de evaluación progresivo para Category III, II, I e IS. Combina fundamentos, puntuación, procedimientos, challenge, passivity y casos complejos de liderazgo arbitral.',rulebook:'Reglamento',rulebookValue:'Enero de 2026',update:'Actualización vigente',updateValue:'1 de enero de 2026',format:'Formato',formatValue:'48 preguntas · 4 niveles',notice:'<b>Aviso:</b> Este es material educativo de práctica, no un examen oficial de certificación UWW. El texto reglamentario en inglés prevalece ante cualquier discrepancia. El logo UWW identifica la organización fuente y no implica respaldo oficial.',level:'Nivel de evaluación',evaluate:'Evaluar esta categoría',write:'Escribe tu decisión y procedimiento…',model:'Respuesta modelo',got:'Lo resolví correctamente',review:'Necesito repasar',automatic:'respuestas automáticas correctas',open:'respuestas abiertas confirmadas. Revisa las respuestas modelo.',clear:'¿Borrar todas las respuestas guardadas?',sources:'Fuentes oficiales',loading:'Cargando examen…',loadError:'No se pudo cargar el examen. Actualiza la página.',labels:{'Category III':'Fundamentos reglamentarios','Category II':'Aplicación práctica','Category I':'Procedimientos avanzados','Category IS':'Liderazgo e interpretación'}},
 fr:{language:'Langue',mastEyebrow:'Formation arbitrale · 2026',mastTitle:'Examen d’entraînement',status:'V1 · Matériel pédagogique · Sources officielles citées',progress:'Votre progression',answered:'répondues',reset:'Effacer les réponses',heroTitle:'Décidez comme si chaque action comptait.',heroText:'Formulaire d’évaluation progressif pour les catégories III, II, I et IS. Il combine fondamentaux, cotation, procédures, challenge, passivité et cas complexes de leadership arbitral.',rulebook:'Règlement',rulebookValue:'Janvier 2026',update:'Mise à jour applicable',updateValue:'1er janvier 2026',format:'Format',formatValue:'48 questions · 4 niveaux',notice:'<b>Avis :</b> Il s’agit d’un support pédagogique d’entraînement et non d’un examen officiel de certification UWW. Le texte anglais du règlement prévaut en cas de divergence. Le logo UWW identifie l’organisation source et n’implique aucune approbation officielle.',level:'Niveau d’évaluation',evaluate:'Évaluer cette catégorie',write:'Écrivez votre décision et la procédure…',model:'Réponse modèle',got:'J’ai bien répondu',review:'À revoir',automatic:'réponses automatiques correctes',open:'réponses ouvertes confirmées. Consultez les réponses modèles.',clear:'Effacer toutes les réponses enregistrées ?',sources:'Sources officielles',loading:'Chargement de l’examen…',loadError:'Impossible de charger l’examen. Veuillez actualiser la page.',labels:{'Category III':'Fondamentaux du règlement','Category II':'Application pratique','Category I':'Procédures avancées','Category IS':'Leadership et interprétation'}},
 ru:{language:'Язык',mastEyebrow:'Судейское образование · 2026',mastTitle:'Тренировочный экзамен',status:'V1 · Учебный материал · Официальные источники',progress:'Ваш прогресс',answered:'отвечено',reset:'Сбросить ответы',heroTitle:'Принимайте решение так, будто каждый эпизод имеет значение.',heroText:'Поэтапная форма оценки для категорий III, II, I и IS. Охватывает основы, оценку действий, процедуры, challenge, passivity и сложные случаи судейского руководства.',rulebook:'Правила',rulebookValue:'Январь 2026',update:'Дата вступления изменений',updateValue:'1 января 2026',format:'Формат',formatValue:'48 вопросов · 4 уровня',notice:'<b>Примечание:</b> Это учебный материал, а не официальный сертификационный экзамен UWW. При расхождениях преимущественную силу имеет английский текст правил. Логотип UWW указывает на организацию-источник и не означает официального одобрения.',level:'Уровень оценки',evaluate:'Оценить эту категорию',write:'Запишите решение и процедуру…',model:'Образец ответа',got:'Ответ верный',review:'Нужно повторить',automatic:'автоматически проверяемых ответов верны',open:'открытых ответов подтверждено. Изучите образцы ответов ниже.',clear:'Удалить все сохранённые ответы?',sources:'Официальные источники',loading:'Загрузка экзамена…',loadError:'Не удалось загрузить экзамен. Обновите страницу.',labels:{'Category III':'Основы правил','Category II':'Практическое применение','Category I':'Продвинутые процедуры','Category IS':'Руководство и интерпретация'}}
};
let lang=localStorage.getItem('uww-exam-language')||'en';let DATA=null;let state=JSON.parse(localStorage.getItem('uww-exam-state')||'{}');let active=localStorage.getItem('uww-exam-category')||'Category III';
const t=()=>UI[lang];const save=()=>localStorage.setItem('uww-exam-state',JSON.stringify(state));
async function loadLanguage(next){lang=next;localStorage.setItem('uww-exam-language',lang);document.documentElement.lang=lang;document.getElementById('languageSelect').value=lang;document.getElementById('loading').style.display='block';try{const r=await fetch(`data/exam-${lang}.json`);if(!r.ok)throw new Error(r.status);DATA=await r.json();applyUI();render();document.getElementById('loading').style.display='none'}catch(e){document.getElementById('loading').textContent=t().loadError;console.error(e)}}
function applyUI(){const x=t();document.title='UWW Referee Practice Examination 2026';for(const [id,key] of Object.entries({languageLabel:'language',mastEyebrow:'mastEyebrow',mastTitle:'mastTitle',statusText:'status',progressLabel:'progress',reset:'reset',heroTitle:'heroTitle',heroText:'heroText',rulebookLabel:'rulebook',rulebookValue:'rulebookValue',updateLabel:'update',updateValue:'updateValue',formatLabel:'format',formatValue:'formatValue',notice:'notice',sourcesTitle:'sources'}))document.getElementById(id).innerHTML=x[key];}
function render(){const x=t(),cats=[...new Set(DATA.questions.map(q=>q.category))],nav=document.getElementById('nav'),quiz=document.getElementById('quiz');nav.innerHTML='';quiz.innerHTML='';cats.forEach(cat=>{const count=DATA.questions.filter(q=>q.category===cat&&(state[q.id]?.value||'').toString().trim()).length,b=document.createElement('button');b.className=cat===active?'active':'';b.innerHTML=`${cat}<small>${count}/12 ${x.answered}</small>`;b.onclick=()=>{active=cat;localStorage.setItem('uww-exam-category',cat);render();window.scrollTo({top:0,behavior:'smooth'})};nav.appendChild(b);const sec=document.createElement('section');sec.className='category '+(cat===active?'active':'');sec.innerHTML=`<div class="category-head"><div><div class="eyebrow" style="color:var(--blue)">${x.level}</div><h3>${cat}</h3></div><span>${x.labels[cat]}</span></div>`;DATA.questions.filter(q=>q.category===cat).forEach(q=>sec.appendChild(questionCard(q)));const result=document.createElement('div');result.className='results';result.id='result-'+cat.replace(/\s/g,'-');sec.appendChild(result);const btn=document.createElement('button');btn.className='action primary';btn.textContent=x.evaluate;btn.onclick=()=>evaluate(cat);sec.appendChild(btn);quiz.appendChild(sec)});document.getElementById('sources').innerHTML=DATA.sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></li>`).join('');updateProgress();}
function questionCard(q){const x=t(),wrap=document.createElement('article');wrap.className='question'+(state[q.id]?.reviewed?' reviewed':'');wrap.id='q'+q.id;let input=q.options.length?`<div class="options">${q.options.map(o=>`<label class="option"><input type="radio" name="q${q.id}" value="${o.key}" ${state[q.id]?.value===o.key?'checked':''}><span><b>${o.key}.</b> ${o.text}</span></label>`).join('')}</div>`:`<textarea aria-label="Question ${q.id}" placeholder="${x.write}">${state[q.id]?.value||''}</textarea>`;wrap.innerHTML=`<div class="qtop"><div class="qnum">${q.id}</div><div class="qtext">${q.question}</div></div>${input}<div class="answer"><strong>${x.model}</strong><div>${q.answer}</div>${q.correct?'':`<div class="selfcheck"><button data-v="yes">${x.got}</button><button data-v="no">${x.review}</button></div>`}</div>`;wrap.querySelectorAll('input').forEach(el=>el.onchange=()=>{state[q.id]={...(state[q.id]||{}),value:el.value};save();updateProgress()});const ta=wrap.querySelector('textarea');if(ta)ta.oninput=()=>{state[q.id]={...(state[q.id]||{}),value:ta.value};save();updateProgress()};wrap.querySelectorAll('.selfcheck button').forEach(btn=>{if(state[q.id]?.self===btn.dataset.v)btn.classList.add('selected');btn.onclick=()=>{state[q.id]={...(state[q.id]||{}),self:btn.dataset.v,reviewed:true};save();render()}});return wrap;}
function evaluate(cat){let right=0,total=0,openReviewed=0;DATA.questions.filter(q=>q.category===cat).forEach(q=>{const el=document.getElementById('q'+q.id);el.classList.add('reviewed');state[q.id]={...(state[q.id]||{}),reviewed:true};if(q.correct){total++;const ok=state[q.id]?.value===q.correct;right+=ok?1:0;el.classList.toggle('correct',ok);el.classList.toggle('incorrect',!ok)}else if(state[q.id]?.self==='yes')openReviewed++});save();const r=document.getElementById('result-'+cat.replace(/\s/g,'-'));r.classList.add('show');r.innerHTML=`<strong>${right}/${total}</strong> ${t().automatic} · ${openReviewed} ${t().open}`;updateProgress();}
function updateProgress(){if(!DATA)return;const answered=DATA.questions.filter(q=>(state[q.id]?.value||'').toString().trim()).length;document.getElementById('done').textContent=answered;document.getElementById('bar').style.width=(answered/48*100)+'%';document.getElementById('percent').textContent=Math.round(answered/48*100)+'% '+t().answered;document.querySelectorAll('#nav button').forEach((b,i)=>{const cat=[...new Set(DATA.questions.map(q=>q.category))][i],n=DATA.questions.filter(q=>q.category===cat&&(state[q.id]?.value||'').toString().trim()).length;b.querySelector('small').textContent=n+'/12 '+t().answered})}
document.getElementById('languageSelect').onchange=e=>loadLanguage(e.target.value);document.getElementById('reset').onclick=()=>{if(confirm(t().clear)){localStorage.removeItem('uww-exam-state');state={};render()}};loadLanguage(lang);
</script></body></html>
